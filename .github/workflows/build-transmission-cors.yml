name: Build Transmission BTC CORS APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AndreyPavlenko/transmissionbtc
          ref: fdfc2b6c6b605b371ad4eb680794ac7158d25815
          path: transmission-source
          persist-credentials: false
      - name: Test CORS origin policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror cors/policy-test.cc -o /tmp/cors-policy-test
          /tmp/cors-policy-test
      - name: Install Android build packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(command -v sdkmanager || true)"
          if [[ -z "$sdk_manager" ]]; then
            for candidate in "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                sdk_manager="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdk_manager" ]]; then
            echo "::error::sdkmanager not found in PATH or $sdk_root/cmdline-tools"
            exit 1
          fi
          echo "Using Android SDK: $sdk_root"
          echo "Using sdkmanager: $sdk_manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          JAVA_HOME="$JAVA_HOME_17_X64" "$sdk_manager" --sdk_root="$sdk_root" \
            'platforms;android-30' 'build-tools;30.0.3' 'ndk;21.4.7075529' 'cmake;3.18.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Apply CORS build changes
        run: node cors/prepare.cjs transmission-source
      - name: Build ARM Android APK
        working-directory: transmission-source
        run: gradle assembleDebug -PABI=arm64-v8a,armeabi-v7a --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: transmission-btc-cors-apk
          path: transmission-source/build/outputs/apk/debug/*.apk
          if-no-files-found: error
